<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PaySika Pro - Production Core</title>
    <style>
        :root {
            --bg-base: #030712;
            --bg-surface: #111827;
            --bg-card: #1F2937;
            --border-color: #374151;
            --primary: #6366F1;
            --primary-hover: #4F46E5;
            --primary-glow: rgba(99, 102, 241, 0.25);
            --success: #10B981;
            --text-main: #F3F4F6;
            --text-muted: #9CA3AF;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-base); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        header { background: var(--bg-surface); border-bottom: 1px solid var(--border-color); padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50; }
        .brand-box { display: flex; align-items: center; gap: 12px; }
        .logo { width: 40px; height: 40px; background: linear-gradient(135deg, #6366F1, #8B5CF6); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; box-shadow: 0 4px 12px var(--primary-glow); }
        .brand-info h1 { font-size: 1rem; font-weight: 800; }
        .brand-info p { font-size: 0.7rem; color: var(--text-muted); }

        .app-container { max-width: 480px; width: 100%; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; flex: 1; }

        .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .field-label { font-size: 0.72rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

        .input-group { background: var(--bg-surface); border: 2px solid var(--border-color); border-radius: 14px; display: flex; align-items: center; padding: 0 14px; transition: border-color 0.2s; }
        .input-group:focus-within { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-glow); }
        .input-group input, .input-group select { width: 100%; background: none; border: none; color: var(--text-main); padding: 14px 0; font-size: 1.15rem; font-weight: 700; outline: none; }
        .input-group select option { background: var(--bg-surface); }

        .btn-action { background: linear-gradient(135deg, #6366F1, #4F46E5); color: white; border: none; border-radius: 14px; padding: 16px; font-size: 1rem; font-weight: 800; cursor: pointer; text-align: center; box-shadow: 0 6px 20px var(--primary-glow); transition: transform 0.1s; }
        .btn-action:active { transform: scale(0.98); }

        .transactions-list { display: flex; flex-direction: column; gap: 10px; max-height: 300px; overflow-y: auto; }
        .tx-item { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; }
        .tx-details h4 { font-size: 0.85rem; font-weight: 700; }
        .tx-details span { font-size: 0.7rem; color: var(--text-muted); }
        .tx-amount { font-size: 0.9rem; font-weight: 800; color: var(--success); }

        .notification { position: fixed; bottom: 20px; left: 20px; right: 20px; background: var(--bg-surface); border: 1px solid var(--success); padding: 14px; border-radius: 14px; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.6); transform: translateY(150%); transition: transform 0.3s ease; z-index: 1000; }
        .notification.show { transform: translateY(0); }
    </style>
</head>
<body>

    <header>
        <div class="brand-box">
            <div class="logo">⚡</div>
            <div class="brand-info">
                <h1>PaySika Engine</h1>
                <p>Core v2.0 Production</p>
            </div>
        </div>
        <div style="font-size: 0.75rem; color: var(--success); font-weight: 700;" id="apiStatus">● API Active</div>
    </header>

    <div class="app-container">
        <div class="card">
            <div>
                <span class="field-label">Montant du transfert</span>
                <div class="input-group" style="margin-top: 6px;">
                    <input type="number" id="transferAmount" value="50000" min="100">
                    <select id="currencyTarget">
                        <option value="XOF">XOF</option>
                        <option value="GNF">GNF</option>
                        <option value="USD">USD</option>
                        <option value="EUR">EUR</option>
                    </select>
                </div>
            </div>

            <button class="btn-action" onclick="AppCore.processTransaction()">Exécuter la Transaction</button>
        </div>

        <div class="card">
            <span class="field-label">Historique Sécurisé (LocalDB)</span>
            <div class="transactions-list" id="dbLogContainer">
                <!-- Rendu dynamique -->
            </div>
        </div>
    </div>

    <div id="toastNotification" class="notification">
        <span style="font-size: 1.2rem;">✅</span>
        <div>
            <h4 style="font-size: 0.85rem;" id="toastTitle">Succès</h4>
            <p style="font-size: 0.72rem; color: var(--text-muted);" id="toastDesc">Opération consignée.</p>
        </div>
    </div>

    <script>
        /**
         * Architecture Moteur - Pattern Singleton / Module Sécurisé
         */
        const AppCore = (() => {
            let state = {
                transactions: JSON.parse(localStorage.getItem('paysika_tx')) || [],
                exchangeRates: {}
            };

            async function init() {
                try {
                    const response = await fetch('https://open.er-api.com/v6/latest/USD');
                    const data = await response.json();
                    state.exchangeRates = data.rates;
                    document.getElementById('apiStatus').style.color = '#10B981';
                } catch (e) {
                    document.getElementById('apiStatus').style.color = '#EF4444';
                    document.getElementById('apiStatus').innerText = '● Mode Offline';
                    state.exchangeRates = { XOF: 605.5, GNF: 8600, USD: 1, EUR: 0.92 };
                }
                renderHistory();
            }

            function processTransaction() {
                const amount = parseFloat(document.getElementById('transferAmount').value);
                const currency = document.getElementById('currencyTarget').value;

                if (!amount || amount <= 0) {
                    showToast('Erreur', 'Veuillez entrer un montant valide.', '#EF4444');
                    return;
                }

                const newTx = {
                    id: 'TX-' + Math.floor(100000 + Math.random() * 900000),
                    amount: amount.toLocaleString('fr-FR') + ' ' + currency,
                    date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };

                state.transactions.unshift(newTx);
                localStorage.setItem('paysika_tx', JSON.stringify(state.transactions));

                renderHistory();
                showToast('Transaction Réglée', `ID: ${newTx.id} validé avec succès.`);
            }

            function renderHistory() {
                const container = document.getElementById('dbLogContainer');
                container.innerHTML = '';

                if (state.transactions.length === 0) {
                    container.innerHTML = '<p style="font-size:0.75rem; color:var(--text-muted); text-align:center; padding:10px;">Aucune transaction enregistrée.</p>';
                    return;
                }

                state.transactions.forEach(tx => {
                    const div = document.createElement('div');
                    div.className = 'tx-item';
                    div.innerHTML = `
                        <div class="tx-details">
                            <h4>${tx.id}</h4>
                            <span>${tx.date}</span>
                        </div>
                        <div class="tx-amount">-${tx.amount}</div>
                    `;
                    container.appendChild(div);
                });
            }

            function showToast(title, desc) {
                const toast = document.getElementById('toastNotification');
                document.getElementById('toastTitle').innerText = title;
                document.getElementById('toastDesc').innerText = desc;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 3000);
            }

            return {
                init,
                processTransaction
            };
        })();

        // Démarrage du moteur au chargement complet
        window.addEventListener('DOMContentLoaded', AppCore.init);
    </script>
</body>
</html>
